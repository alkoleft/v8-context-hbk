<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1C Documentation</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Generated HBK documentation</p>
          <h1>1C Documentation</h1>
        </div>
        <div class="locale-bar" id="localeBar" aria-label="Locales"></div>
      </header>
      <main class="layout">
        <nav class="toc-panel" aria-label="Documentation navigation">
          <div class="toc-title">Contents</div>
          <div class="toc-tree" id="tocRoot"></div>
        </nav>
        <article class="page-panel" id="pagePanel">
          <div class="empty-state">
            <h2>Select a documentation page</h2>
            <p>Use the contents tree to open generated Markdown page data.</p>
          </div>
        </article>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
