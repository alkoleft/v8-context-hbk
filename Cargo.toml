[workspace]
members = [
    "crates/context-resolver-core",
    "crates/context-resolver-search",
    "crates/hbk-book",
    "crates/hbk-book-export",
    "crates/hbk-container",
    "crates/hbk-doc-site",
    "crates/hbk-docs",
    "crates/hbk-syntax-export",
    "crates/syntax-helper-extract",
    "crates/syntax-helper-language",
    "crates/syntax-helper-model",
    "crates/syntax-helper-search",
    "crates/v8-context-hbk-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.11"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
hbk-book = { path = "crates/hbk-book" }
hbk-book-export = { path = "crates/hbk-book-export" }
hbk-container = { path = "crates/hbk-container" }
hbk-doc-site = { path = "crates/hbk-doc-site" }
hbk-docs = { path = "crates/hbk-docs" }
hbk-syntax-export = { path = "crates/hbk-syntax-export" }
context-resolver-core = { path = "crates/context-resolver-core" }
context-resolver-search = { path = "crates/context-resolver-search" }
fnv = "1.0.7"
html-escape = "0.2.13"
memmap2 = "0.9.9"
quick_html2md = "0.2.1"
scraper = "0.26.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
slug = "0.1.6"
strsim = "0.11.1"
syntax-helper-extract = { path = "crates/syntax-helper-extract" }
syntax-helper-language = { path = "crates/syntax-helper-language" }
syntax-helper-model = { path = "crates/syntax-helper-model" }
syntax-helper-search = { path = "crates/syntax-helper-search" }
thiserror = "2.0.17"
v8-context-semantic-entities = { path = "../v8-context-semantic-entities" }
winnow = "1.0.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
